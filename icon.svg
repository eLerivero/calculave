<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="230" r="140" fill="#10b981" opacity="0.18" filter="url(#glow)"/>

  <!-- Main Calculator Card -->
  <g filter="url(#shadow)">
    <rect x="96" y="76" width="320" height="360" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
    
    <!-- Display Screen -->
    <rect x="126" y="106" width="260" height="90" rx="22" fill="#090d16" stroke="rgba(16,185,129,0.35)" stroke-width="2"/>
    
    <!-- Display Value (% and Lr) -->
    <text x="146" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="800" fill="#34d399">%</text>
    <text x="366" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="38" font-weight="900" fill="#f8fafc" text-anchor="end">Lr</text>
    
    <!-- Keypad Grid -->
    <!-- Row 1 -->
    <rect x="126" y="220" width="70" height="52" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="161" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#94a3b8" text-anchor="middle">$</text>

    <rect x="221" y="220" width="70" height="52" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="256" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="middle">Bs</text>

    <rect x="316" y="220" width="70" height="52" rx="16" fill="url(#goldGrad)"/>
    <text x="351" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">÷</text>

    <!-- Row 2 -->
    <rect x="126" y="290" width="70" height="52" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="161" y="325" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0" text-anchor="middle">7</text>

    <rect x="221" y="290" width="70" height="52" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0" text-anchor="middle">8</text>

    <rect x="316" y="290" width="70" height="52" rx="16" fill="url(#emeraldGrad)"/>
    <text x="351" y="325" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">×</text>

    <!-- Row 3 (Bottom Action / Equal) -->
    <rect x="126" y="360" width="165" height="52" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="208" y="395" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#34d399" letter-spacing="1" text-anchor="middle">CALC</text>

    <rect x="316" y="360" width="70" height="52" rx="16" fill="url(#emeraldGrad)"/>
    <text x="351" y="396" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">=</text>
  </g>

  <!-- Premium Badge Floating at Top Right -->
  <g filter="url(#shadow)">
    <circle cx="410" cy="95" r="28" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="3"/>
    <text x="410" y="103" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">⚡</text>
  </g>
</svg>
