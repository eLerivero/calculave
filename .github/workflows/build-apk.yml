name: Compilación Android & Google Play Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK y Bundle (Google Play)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar activos web con Capacitor
        run: npm run cap:sync

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Decodificar Keystore de Firma (si está configurado en Secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Compilar APK Debug (Pruebas Locales)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compilar App Bundle AAB para Google Play Store (Release)
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Publicar APK Debug de prueba
        uses: actions/upload-artifact@v4
        with:
          name: CalculaVE-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Google Play App Bundle (AAB Release)
        uses: actions/upload-artifact@v4
        with:
          name: CalculaVE-GooglePlay-Bundle-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar APK Release (Producción)
        uses: actions/upload-artifact@v4
        with:
          name: CalculaVE-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
